# ==============================================================================
# PaySync - Decoupled Architecture (Nginx Frontend + Express Backend)
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.decoupled.yml up -d --build
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paysync_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_PATH=/app/data/app_data.db
      - CORS_ORIGIN=*
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - paysync_backend_data:/app/data
      - paysync_backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paysync_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  paysync_backend_data:
    driver: local
  paysync_backend_uploads:
    driver: local
