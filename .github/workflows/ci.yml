# ==============================================================================
# PaySync - CI / CD Pipeline (GitHub Actions)
# ==============================================================================

name: PaySync CI / CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Tests & Mathematical Validation
  # ----------------------------------------------------------------------------
  test-backend:
    name: Backend Tests & Vision Pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Tests
        run: |
          cd backend
          npm test

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Linting & Production Build
  # ----------------------------------------------------------------------------
  build-frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Unified Fullstack Build & Container Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Dockerfile Build & Smoke Test
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: paysync:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
