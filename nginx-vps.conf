# ==============================================================================
# PaySync - Host Nginx Reverse Proxy Configuration (Ubuntu/Debian VPS)
# ==============================================================================
# Copia este archivo a: /etc/nginx/sites-available/paysync
# Habilítalo con: ln -s /etc/nginx/sites-available/paysync /etc/nginx/sites-enabled/
# Configura SSL con: certbot --nginx -d tudominio.com
# ==============================================================================

server {
    listen 80;
    server_name tudominio.com www.tudominio.com;

    # Tamaño máximo de subida para fotos de facturas (5MB)
    client_max_body_size 5M;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Redirección de todas las peticiones al servicio Node.js (PM2 en puerto 3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Cabeceras requeridas para WebSockets (Socket.io)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cabeceras de cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de conexión
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
