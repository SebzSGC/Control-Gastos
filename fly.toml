# ==============================================================================
# PaySync - Fly.io Configuration (fly.toml)
# ==============================================================================

app = "paysync-app"
primary_region = "bog"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/app_data.db"
  UPLOAD_DIR = "/data/uploads"
  CORS_ORIGIN = "*"

[mounts]
  source = "paysync_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
